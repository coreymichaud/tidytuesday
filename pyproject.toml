[project]
name = "tidytuesday"
version = "0.1.0"
description = "My work for TidyTuesday :)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "pydytuesday>=0.1.2",
]

[tool.setuptools]
packages = ["utils"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
